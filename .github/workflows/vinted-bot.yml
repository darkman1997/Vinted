name: Vinted

# Resta in ascolto dei comandi Telegram e controlla i nuovi annunci.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda un messaggio di prova invece di controllare"
        type: boolean
        default: false

concurrency:
  group: vinted
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dipendenze
        run: |
          pip install --quiet langdetect || echo "langdetect non installato: filtro lingua salta questo giro"

      - name: Messaggio di prova
        if: ${{ inputs.prova == 'true' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.VINTED_TELEGRAM_TOKEN }}
        run: python vinted.py --test

      - name: Ascolta i comandi e controlla gli annunci
        if: ${{ inputs.prova != 'true' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.VINTED_TELEGRAM_TOKEN }}
          SECONDI_ASCOLTO: "420"          # resta in ascolto 7 minuti
          INTERVALLO_CONTROLLO: "120"     # cerca nuovi annunci ogni 2 minuti
          ATTESA_POLL: "20"               # long polling: risposta in pochi secondi
        run: python vinted.py --loop

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add vinted-stato.json
          git diff --staged --quiet || git commit -m "vinted stato"
          for tentativo in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git checkout -- .; git reset --hard origin/main; }
            git push && break
            sleep 5
          done

      - name: Prossimo giro (catena)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          curl -s -o /dev/null -w 'next=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/vinted-bot.yml/dispatches" || true
