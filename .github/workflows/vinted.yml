name: Vinted

# Controlla i nuovi annunci delle ricerche salvate.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda un messaggio di prova invece di controllare"
        type: boolean
        default: false

concurrency:
  group: vinted
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controlla gli annunci
        env:
          TELEGRAM_TOKEN: ${{ secrets.VINTED_TELEGRAM_TOKEN }}
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            python vinted.py --test
          else
            python vinted.py --once
          fi

      - name: Salva lo stato
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add vinted-stato.json
          git diff --staged --quiet || git commit -m "vinted stato"
          git push
